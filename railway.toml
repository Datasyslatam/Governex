[build]
builder = "railpack"
buildCommand = "npm run build"

[variables]
RAILPACK_NO_SPA = "1"
RAILPACK_NODE_VERSION = "22.12"

[deploy]
# Aplica las migraciones pendientes antes de cada despliegue, por la red
# privada de Railway (la BD no tiene acceso público). Si falla, el despliegue
# se detiene y la versión anterior sigue atendiendo. Ver
# docs/seguridad/MIGRACIONES_PRODUCCION.md. --baseline-si-vacia=019 solo actúa si
# schema_migrations está vacía (caso de producción el 2026-11-14); luego no hace nada.
preDeployCommand = ["npm run migrate -- --baseline-si-vacia=019"]
startCommand = "node dist-server/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
