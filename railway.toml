[build]
builder = "railpack"
buildCommand = "node node_modules/typescript/bin/tsc -p tsconfig.server.json && echo '{\"type\": \"commonjs\"}' > dist-server/package.json && node node_modules/vite/bin/vite.js build"

[variables]
RAILPACK_NO_SPA = "1"
RAILPACK_NODE_VERSION = "22.12"

[deploy]
startCommand = "node dist-server/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
